<!-- =========================================================================
     entete.html — haut de page commun de l'Atelier du Verdier
     =========================================================================
     GABARIT DU KIT, recopié dans chaque site par outils/diffuser_kit.py.
     Ne pas l'éditer dans une copie : elle sera écrasée.
     Source : atelierduverdier/site — kit/entete.html

     Marques à remplacer par le générateur :
       {{TITRE}}        titre de l'onglet
       {{DESCRIPTION}}  méta description (une phrase, pour les moteurs)
       {{RACINE}}       préfixe vers le kit depuis la page : "" ou "../"
       {{SOUS_TITRE}}   « Atelier Laser », « Journal PrintNC »… vide pour le portail
       {{NAV}}          les <a> de navigation
       {{LOCAL_CSS}}    <link> vers la feuille propre au site, ou vide

     IMPORTANT — la balise <html> ne porte PAS de data-theme en dur.
     Le site laser écrivait data-theme="light" : comme
     :root[data-theme="light"] est plus spécifique que le bloc
     @media (prefers-color-scheme: dark), un visiteur dont le système est
     en sombre recevait quand même la page blanche (vérifié le 11/08/2026 :
     fond rendu rgb(255,255,255) système en sombre). Son thème sombre
     existait bel et bien — #14171b — mais seul le bouton ◐ y donnait accès.
     ========================================================================= -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITRE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" type="image/svg+xml" href="{{RACINE}}chapeau.svg">

<!-- Anti-clignotement : pose le thème choisi AVANT que la feuille de style
     ne peigne. Placé ici et pas dans verdier.js, qui est chargé en fin de
     page — sinon le visiteur voit le thème clair une fraction de seconde
     avant la bascule. Volontairement minuscule et en ligne. -->
<script>
(function(){try{
  var m=document.cookie.match(/(?:^|;\s*)verdier-theme=(light|dark)/);
  var v=m?m[1]:localStorage.getItem('verdier-theme');
  if(v)document.documentElement.setAttribute('data-theme',v);
}catch(e){}})();
</script>

<link rel="stylesheet" href="{{RACINE}}verdier.css">
{{LOCAL_CSS}}
</head>
<body>
<a id="top"></a>

<header class="topbar">
  <div class="wrap">
    <!-- Le logo est COLLÉ ici, pas chargé en <img> : en ligne, son
         mot-symbole suit `currentColor`, donc le bouton de thème. En <img>
         il ne suivrait que le réglage du système. -->
    <a class="brand" href="https://atelierduverdier.fr/" aria-label="Atelier du Verdier">
      {{LOGO}}
      <span class="brand-sub">{{SOUS_TITRE}}</span>
    </a>
    <button class="nav-btn" type="button" aria-label="Ouvrir le menu"
            aria-controls="menu-principal">☰</button>
    <nav class="navlinks" id="menu-principal">
      {{NAV}}
    </nav>
    <button class="theme-btn" type="button" title="Thème clair / sombre"
            aria-label="Basculer entre le thème clair et le thème sombre">◐</button>
  </div>
</header>
